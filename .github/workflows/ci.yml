name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to test when called by the release workflow
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install '.[dev]'
      - run: .venv/bin/ruff check src scripts tests && .venv/bin/ruff format --check src scripts tests
      - run: .venv/bin/mypy src tests scripts
      - run: .venv/bin/pytest --cov=fsched --cov-fail-under=85
      - run: .venv/bin/python -m build && .venv/bin/fsched --help
      - name: Source installer smoke (no user-manager dependency)
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/fsched-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/fsched-config"
          export XDG_STATE_HOME="$RUNNER_TEMP/fsched-state"
          scripts/install.sh --no-start --bin-dir "$RUNNER_TEMP/fsched-bin"
          "$RUNNER_TEMP/fsched-bin/fsched" --version
  systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare disposable runner user manager
        run: |
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu memory pids\n' | sudo tee /etc/systemd/system/user@.service.d/fsched-ci.conf
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$USER"
          sudo systemctl restart "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - run: python -m venv .venv && .venv/bin/python -m pip install '.[dev]'
      - name: Check actual user cgroup enforcement
        id: cgroups
        run: |
          if .venv/bin/python scripts/check_systemd.py; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 77 ]; then exit "$status"; fi
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live systemd tests skipped: delegated enforcement is unavailable"
            echo "### Live systemd tests: SKIPPED" >> "$GITHUB_STEP_SUMMARY"
            echo "The isolated user-slice/service probe could not verify enforcement. This run does not validate live scheduling." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install and run real protected jobs
        if: steps.cgroups.outputs.supported == 'true'
        run: |
          scripts/install.sh --bin-dir "$HOME/bin"
          export PATH="$HOME/bin:$PATH"
          # Wait for the first cycle to configure and verify the kernel limits.
          for attempt in $(seq 1 20); do
            if fsched doctor; then break; fi
            sleep 1
          done
          fsched doctor
          FSCHED_SYSTEMD_TESTS=1 .venv/bin/pytest -m systemd -v
          echo "### Live systemd tests: PASSED" >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics
        if: failure()
        run: |
          systemctl --user status fsched.service fsched.slice --no-pager || true
          journalctl --user -u fsched.service -n 100 --no-pager || true
      - name: Stop this workflow's worker
        if: always() && steps.cgroups.outputs.supported == 'true'
        run: systemctl --user disable --now fsched.service || true
