[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "friendlyscheduler"
version = "0.1.0"
description = "A conservative per-user systemd job scheduler for shared Linux hosts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-only"}
authors = [{name = "FriendlyScheduler contributors"}]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
fsched = "fsched.__main__:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.2.1", "ruff==0.14.0", "mypy==1.18.2", "build==1.3.0", "pyinstaller==6.16.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["systemd: requires a real systemd user manager and delegated cgroup v2"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP007", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src", "tests"]
